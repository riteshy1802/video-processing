apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: planner-scaler
spec:
  scaleTargetRef:
    name: planner

  minReplicaCount: 1
  maxReplicaCount: 6

  pollingInterval: 5
  cooldownPeriod: 30

  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka.default.svc.cluster.local:9092
        consumerGroup: video-planners
        topic: planner.jobs
        lagThreshold: "1"
        offsetResetPolicy: earliest