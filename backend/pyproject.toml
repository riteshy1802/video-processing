[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.95",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
