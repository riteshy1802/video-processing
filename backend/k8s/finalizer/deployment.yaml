apiVersion: apps/v1
kind: Deployment
metadata:
  name: rendition-finalizer

spec:
  replicas: 1

  selector:
    matchLabels:
      app: rendition-finalizer

  template:
    metadata:
      labels:
        app: rendition-finalizer

    spec:
      containers:
        - name: finalizer
          image: video-processing-backend:local
          imagePullPolicy: Never

          command: ["python", "-m", "finalizer.main"]

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          envFrom:
            - secretRef:
                name: video-processing-env

          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"

            - name: REDIS_URL
              value: "redis://redis:6379/0"