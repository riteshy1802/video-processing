apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcode-worker
spec:

  selector:
    matchLabels:
      app: transcode-worker

  template:
    metadata:
      labels:
        app: transcode-worker

    spec:
      nodeSelector:
        workload: transcode
      containers:
        - name: worker
          image: 815470164705.dkr.ecr.ap-southeast-2.amazonaws.com/video-processing-backend:v1
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"

          command: ["python", "-m", "worker.main"]

          envFrom:
            - secretRef:
                name: video-processing-env

          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"

            - name: REDIS_URL
              value: "redis://redis:6379/0"