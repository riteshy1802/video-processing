apiVersion: apps/v1
kind: Deployment
metadata:
  name: api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api

    spec:
      containers:
        - name: api
          image: 815470164705.dkr.ecr.ap-southeast-2.amazonaws.com/video-processing-backend:v1
          imagePullPolicy: IfNotPresent

          command:
            - uvicorn
            - app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "7500"

          ports:
            - containerPort: 7500

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          envFrom:
            - secretRef:
                name: video-processing-env

          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: REDIS_URL
              value: "redis://redis:6379/0"