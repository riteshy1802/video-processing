apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: video-finalizer-scaler

spec:
  scaleTargetRef:
    name: video-finalizer

  minReplicaCount: 1
  maxReplicaCount: 3

  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka.default.svc.cluster.local:9092
        consumerGroup: video-finalizers
        topic: finalize.video.jobs
        lagThreshold: "1"
        offsetResetPolicy: earliest