apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner

spec:
  replicas: 1

  selector:
    matchLabels:
      app: planner

  template:
    metadata:
      labels:
        app: planner

    spec:
      containers:
        - name: planner
          image: 815470164705.dkr.ecr.ap-southeast-2.amazonaws.com/video-processing-backend:v1
          imagePullPolicy: IfNotPresent

          command: ["python", "-m", "planner.main"]

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          envFrom:
            - secretRef:
                name: video-processing-env

          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"

            - name: REDIS_URL
              value: "redis://redis:6379/0"